name: PR Artifacts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-artifacts-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit-tracked-artifacts:
    name: Audit tracked artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject committed binary artifacts
        shell: bash
        run: |
          tracked="$(git ls-files '*.exe' '*.unitypackage' '*.dll' '*.pdb')"
          if [ -n "$tracked" ]; then
            echo "Binary build artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

  build-exe:
    name: Build bHapticsOSC.exe
    runs-on: windows-latest
    needs: audit-tracked-artifacts
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Release executable
        shell: pwsh
        run: |
          dotnet msbuild External\bHapticsOSC\bHapticsOSC.sln /m /restore /p:Configuration=Release /p:Platform="Any CPU"

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $outputPath = "External\bHapticsOSC\Output\Release"
          $exePath = Join-Path $outputPath "bHapticsOSC.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
              throw "Expected executable was not produced: $exePath"
          }

          $artifactPath = "artifacts\bHapticsOSC"
          New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null
          Copy-Item -Path (Join-Path $outputPath '*') -Destination $artifactPath -Recurse

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bHapticsOSC.exe
          path: artifacts/bHapticsOSC/
          if-no-files-found: error
          retention-days: 14

  comment-pr-artifacts:
    name: Comment PR artifacts
    runs-on: ubuntu-latest
    needs: build-exe
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Update PR artifact comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- bhaptics-pr-artifacts -->';
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });

            const wantedArtifacts = [
              { name: 'bHapticsOSC.exe', label: 'bHapticsOSC.exe' },
              { name: 'bHapticsOSC-VRChat.unitypackage', label: 'bHapticsOSC-VRChat.unitypackage' },
            ];

            const artifactRows = wantedArtifacts.map(({ name, label }) => {
              const artifact = artifacts.find(item => item.name === name && !item.expired);
              if (!artifact) {
                core.warning(`Expected artifact was not found: ${name}`);
                return `| ${label} | Not found in this run |`;
              }

              const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              return `| ${label} | [Download artifact](${artifactUrl}) |`;
            });

            const body = [
              marker,
              'PR build artifacts are ready.',
              '',
              '| Artifact | Link |',
              '| --- | --- |',
              ...artifactRows,
              '',
              `Workflow run: [${context.workflow} #${context.runNumber}](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Artifacts are temporary and expire according to the repository retention policy.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body,
              });
            }

  build-unity-package:
    name: Build Unity package
    runs-on: ubuntu-latest
    needs: audit-tracked-artifacts
    timeout-minutes: 60
    environment: unity-pr-artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve VPM packages
        uses: anatawa12/sh-actions/resolve-vpm-packages@1d155c7a26bcd0a54ffd9cb38fd66ab0d32d23cd
        with:
          project-path: Unity
          repos: |
            https://vcc.vrcfury.com/

      - name: Export Unity package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: 2022.3.22f1
          targetPlatform: StandaloneWindows64
          buildMethod: bHapticsOSC.VRChat.bPackageExporter.ExportFromCommandLine
          customParameters: -bHapticsExportPath /github/workspace/dist/bHapticsOSC-VRChat.unitypackage
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Upload Unity package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bHapticsOSC-VRChat.unitypackage
          path: dist/bHapticsOSC-VRChat.unitypackage
          if-no-files-found: error
          retention-days: 14
