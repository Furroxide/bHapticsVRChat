name: Release metadata

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-metadata-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-release-metadata:
    name: Validate version, changelog, and VPM manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # A pull request that leaves VERSION alone is not proposing a release, so it should not be
      # held to release rules - it would otherwise have to fail, since the version it carries is
      # the one already published. Before the first release main had no VERSION file at all and
      # nothing to compare against, which is why this only began to bite once 2.4.0 landed.
      - name: Decide whether this pull request proposes a release
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if git diff --quiet "origin/$BASE_REF" HEAD -- VERSION; then
            echo "VERSION is unchanged; this pull request does not propose a release."
            echo "release_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION changed; validating this pull request as a release."
            echo "release_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release metadata
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          RELEASE_PR: ${{ steps.scope.outputs.release_pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hashtable, not an array: splatting an array passes its elements positionally, so
          # '-AllowUnchangedVersion' would bind to $RepositoryRoot rather than to the switch.
          $extra = @{}
          if ($env:RELEASE_PR -ne 'true') { $extra['AllowUnchangedVersion'] = $true }
          ./Tools/Validate-ReleaseMetadata.ps1 -BaseRef "origin/$env:BASE_REF" @extra
