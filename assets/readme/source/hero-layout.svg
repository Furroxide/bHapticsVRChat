<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">bHaptics VRChatOSC — VRChat avatar haptics</title>
  <desc id="hero-desc">A rectangular haptic motor panel routes contact through OSC beside the genuine bHapticsOSC Unity Setup Assistant.</desc>

  <defs>
    <clipPath id="setup-assistant-clip">
      <rect x="690" y="60" width="460" height="560" rx="16"/>
    </clipPath>
  </defs>

  <g id="canvas">
    <rect width="1200" height="680" rx="28" fill="#090c12"/>
    <rect x="1" y="1" width="1198" height="678" rx="27"
          fill="none" stroke="#aab6c8" stroke-opacity="0.16"/>
    <path d="M650 48V632" fill="none" stroke="#aab6c8" stroke-opacity="0.14"/>
  </g>

  <g id="title-block"
     transform="translate(64 54)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="brand-mark" transform="translate(0 1)">
      <rect x="5" y="5" width="25" height="18" rx="5"
            transform="rotate(38 17.5 14)"
            fill="none" stroke="#ffd700" stroke-width="4"/>
    </g>

    <text id="category" x="46" y="22"
          fill="#36c5f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700" letter-spacing="2.6">VRCHAT AVATAR HAPTICS</text>

    <g id="project-name" fill="#f6f8fb" font-size="68" font-weight="700" letter-spacing="-1.8">
      <text x="0" y="108">bHaptics</text>
      <text x="0" y="178">VRChatOSC</text>
    </g>

    <g id="value-proposition" fill="#aab6c8" font-size="25" font-weight="450">
      <text x="0" y="246">Bring VRChat touch and impact feedback</text>
      <text x="0" y="282">to supported bHaptics gear through a</text>
      <text x="0" y="318">guided Unity package and Windows OSC</text>
      <text x="0" y="354">companion.</text>
    </g>
  </g>

  <g id="haptic-motif">
    <g id="signal-route"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="16" font-weight="700" letter-spacing="1.4">
      <path d="M184 500C230 500 230 459 276 459H600C630 459 642 480 676 480"
            fill="none" stroke="#aab6c8" stroke-opacity="0.42" stroke-width="2"/>

      <circle cx="286" cy="459" r="6" fill="#36c5f0"/>
      <circle cx="446" cy="459" r="6" fill="#36c5f0"/>
      <circle cx="606" cy="459" r="6" fill="#43f2ab"/>

      <text x="286" y="494" text-anchor="middle" fill="#aab6c8">CONTACT</text>
      <text x="446" y="494" text-anchor="middle" fill="#aab6c8">OSC</text>
      <text x="606" y="494" text-anchor="middle" fill="#aab6c8">MOTORS</text>
    </g>

    <g id="haptic-vest" transform="translate(72 404)"
       fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="52" y="20" width="60" height="156"
            fill="#43f2ab" fill-opacity="0.05"
            stroke="#36c5f0" stroke-width="2.5"/>

      <g id="motor-grid" fill="#43f2ab" stroke="none">
        <circle cx="64" cy="58" r="3"/><circle cx="76" cy="58" r="3"/>
        <circle cx="88" cy="58" r="3"/><circle cx="100" cy="58" r="3"/>
        <circle cx="64" cy="74" r="3"/><circle cx="76" cy="74" r="3"/>
        <circle cx="88" cy="74" r="3"/><circle cx="100" cy="74" r="3"/>
        <circle cx="64" cy="90" r="3"/><circle cx="76" cy="90" r="3"/>
        <circle cx="88" cy="90" r="3"/><circle cx="100" cy="90" r="3"/>
        <circle cx="64" cy="106" r="3"/><circle cx="76" cy="106" r="3"/>
        <circle cx="88" cy="106" r="3"/><circle cx="100" cy="106" r="3"/>
        <circle cx="64" cy="122" r="3"/><circle cx="76" cy="122" r="3"/>
        <circle cx="88" cy="122" r="3"/><circle cx="100" cy="122" r="3"/>
      </g>

      <circle cx="28" cy="90" r="4" fill="#36c5f0" stroke="none"/>
      <path d="M34 90H54" stroke="#36c5f0" stroke-width="2"/>
    </g>
  </g>

  <g id="screenshot-proof">
    <rect id="screenshot-frame" x="676" y="46" width="488" height="588" rx="24"
          fill="#f6f8fb" fill-opacity="0.04"
          stroke="#aab6c8" stroke-opacity="0.28"/>

    <g id="screenshot-placeholder"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       text-anchor="middle">
      <rect x="690" y="60" width="460" height="560" rx="16"
            fill="#f6f8fb" fill-opacity="0.03"/>
      <text x="920" y="330" fill="#aab6c8" font-size="18" font-weight="700" letter-spacing="1.8">GENUINE UNITY CAPTURE</text>
      <text x="920" y="360" fill="#aab6c8" fill-opacity="0.72" font-size="16">setup-assistant.png</text>
    </g>

    <image id="setup-assistant-capture"
           href="setup-assistant.png"
           x="690" y="60" width="460" height="560"
           preserveAspectRatio="xMidYMid meet"
           clip-path="url(#setup-assistant-clip)"/>
  </g>
</svg>
